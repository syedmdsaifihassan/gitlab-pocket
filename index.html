<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1e24" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="GitLab">
<link rel="manifest" id="mf" href="manifest.webmanifest">
<link rel="icon" id="fav" href="icons/classic.svg">
<link rel="apple-touch-icon" id="ati" href="icons/classic-180.png">
<script>
/* Pick the app icon before the browser reads the manifest. ?icon=name in the URL also sets it (used to reinstall with a new icon). */
(function(){try{var q=new URLSearchParams(location.search).get('icon');if(q&&/^[a-z]+$/.test(q))localStorage.setItem('app_icon',q);
var k=localStorage.getItem('app_icon');if(k&&/^[a-z]+$/.test(k)){document.getElementById('mf').href='manifest-'+k+'.webmanifest';document.getElementById('fav').href='icons/'+k+'.svg';document.getElementById('ati').href='icons/'+k+'-180.png';}}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<title>GitLab Pocket</title>
<style>
:root{
  --bg:#fbfafd;--surface:#fff;--subtle:#f5f5f7;--hover:#ececef;--line:#dcdcde;--line-soft:#ececef;
  --text:#333238;--strong:#1f1e24;--muted:#626168;
  --blue:#1f75cb;--blue-d:#1068bf;--blue-bg:#e9f3fc;--green:#108548;--green-bg:#c3e6cd;
  --red:#dd2b0e;--red-bg:#fdd4cd;--orange:#ab6100;--orange-bg:#f5d9a8;--purple:#6e49cb;--purple-bg:#e1d8f9;--neutral-bg:#ececef;
  --add:#ecfdf0;--add-ln:#ddfbe6;--del:#fbe9eb;--del-ln:#f9d7dc;--hunk:#f0f0f6;--code-bg:#f5f5f7;--log:#1f1e24;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#18171d;--surface:#1f1e24;--subtle:#28272d;--hover:#333238;--line:#434248;--line-soft:#333238;
  --text:#ececef;--strong:#fff;--muted:#a4a3a8;
  --blue:#63a6e9;--blue-d:#428fdc;--blue-bg:#0b2a4a;--green:#52b87a;--green-bg:#0d4026;--red:#f57f6c;--red-bg:#5a1408;
  --orange:#e9be74;--orange-bg:#4a3108;--purple:#ac93e6;--purple-bg:#2f2a6b;--neutral-bg:#333238;
  --add:#10291b;--add-ln:#143523;--del:#361512;--del-ln:#471a16;--hunk:#25242c;--code-bg:#28272d;--log:#0e0e12;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18171d;--surface:#1f1e24;--subtle:#28272d;--hover:#333238;--line:#434248;--line-soft:#333238;
  --text:#ececef;--strong:#fff;--muted:#a4a3a8;
  --blue:#63a6e9;--blue-d:#428fdc;--blue-bg:#0b2a4a;--green:#52b87a;--green-bg:#0d4026;--red:#f57f6c;--red-bg:#5a1408;
  --orange:#e9be74;--orange-bg:#4a3108;--purple:#ac93e6;--purple-bg:#2f2a6b;--neutral-bg:#333238;
  --add:#10291b;--add-ln:#143523;--del:#361512;--del-ln:#471a16;--hunk:#25242c;--code-bg:#28272d;--log:#0e0e12;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,"GitLab Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-tap-highlight-color:transparent;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding:env(safe-area-inset-top,0px) 4px 0;display:flex;align-items:center;min-height:calc(52px + env(safe-area-inset-top,0px))}
.ttl{flex:1;min-width:0;padding:6px 6px}
#ttl{font-weight:600;font-size:16px;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{background:none;border:0;width:42px;height:42px;display:grid;place-items:center;border-radius:6px;color:var(--text);flex:none}
.icon-btn:active{background:var(--hover)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;color:var(--muted);font-size:11px;font-weight:500;position:relative}
#nav a svg.i{width:22px;height:22px}
#nav a.on{color:var(--blue)}
.nbadge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--blue);color:#fff;font-size:10px;font-weight:700;border-radius:9px;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center}
main{max-width:860px;margin:0 auto}
.loading{display:grid;place-items:center;padding:60px 0}
.spinner{width:24px;height:24px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--blue);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation-duration:3s}}
.tabs{display:flex;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--line);scrollbar-width:none;position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:10}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;padding:12px 14px 10px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--strong);font-weight:600;border-bottom-color:var(--blue)}
.count{display:inline-block;background:var(--neutral-bg);color:var(--muted);border-radius:9px;font-size:12px;padding:0 7px;margin-left:6px;font-weight:500}
.list{background:var(--surface);border-bottom:1px solid var(--line)}
.item{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line-soft);align-items:flex-start;cursor:pointer}
.item:first-child{border-top:0}
.item:active{background:var(--subtle)}
.grow{flex:1;min-width:0}
.title{font-weight:600;color:var(--strong);word-break:break-word;line-height:1.35}
.meta{font-size:13px;color:var(--muted);word-break:break-word}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.nowrap{white-space:nowrap}
.section-h{display:flex;align-items:center;gap:8px;padding:16px 16px 8px;font-weight:600;color:var(--strong)}
.section-h .meta{font-weight:400}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px}
.toolbar .grow{min-width:0}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;line-height:1;padding:4px 8px;border-radius:999px;white-space:nowrap;vertical-align:1px}
.b-ok{background:var(--green-bg);color:var(--green)}.b-bad{background:var(--red-bg);color:var(--red)}
.b-merged{background:var(--purple-bg);color:var(--purple)}.b-info{background:var(--blue-bg);color:var(--blue)}
.b-warn{background:var(--orange-bg);color:var(--orange)}.b-neutral{background:var(--neutral-bg);color:var(--muted)}
.labels{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.label{display:inline-block;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--lc,var(--neutral-bg));color:var(--lt,var(--text));white-space:nowrap;border:1px solid transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:8px 14px;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:active{background:var(--hover)}
.btn.confirm{background:var(--blue);border-color:var(--blue-d);color:#fff}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger-o{color:var(--red);border-color:var(--red)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn.tertiary{border-color:transparent;background:transparent}
.btn:disabled{opacity:.55;pointer-events:none}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btns.center{justify-content:center}
.link{background:none;border:0;padding:0;color:var(--blue);font-size:13px;cursor:pointer}
.link.danger{color:var(--red)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin:12px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line-soft);font-weight:600;color:var(--strong);background:var(--subtle)}
.card-h .grow{font-weight:600}
.card-b{padding:12px 14px}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty-t{font-weight:600;font-size:16px;color:var(--strong);margin-bottom:4px}
.av{position:relative;display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;font-weight:600;flex:none;vertical-align:middle}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--surface)}
.av0{background:#fcf1ef;color:#8f2110}.av1{background:#f4f0ff;color:#5943b6}.av2{background:#f1f1ff;color:#3434a6}
.av3{background:#e9f3fc;color:#0b5cad}.av4{background:#ecf4ee;color:#24663b}.av5{background:#fdf1dd;color:#8a5c00}
.av.sq{border-radius:6px}
.avs{display:inline-flex}.avs .av{margin-left:-6px;box-shadow:0 0 0 2px var(--surface)}.avs .av:first-child{margin-left:0}
.ci{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;flex:none;vertical-align:-4px}
.ci svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.ci-ok{color:var(--green)}.ci-bad{color:var(--red)}.ci-warn{color:var(--orange)}.ci-neutral{color:var(--muted)}
.ci-run{color:var(--blue);background:conic-gradient(currentColor 0 50%,transparent 50% 100%)}
.ci-none{color:var(--line)}
.page-h{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px}
.page-h h1{font-size:20px;line-height:1.3;margin:8px 0 6px;color:var(--strong);word-break:break-word}
.branch{display:inline-block;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--blue-bg);color:var(--blue);border:0;border-radius:4px;padding:1px 6px;word-break:break-all;cursor:pointer}
.md{word-break:break-word;overflow-wrap:anywhere;font-size:15px}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p,.md ul,.md ol,.md pre,.md blockquote,.md table{margin:0 0 10px}
.md h1,.md h2,.md h3,.md h4{color:var(--strong);margin:16px 0 8px;line-height:1.3}
.md h1{font-size:20px;border-bottom:1px solid var(--line);padding-bottom:6px}.md h2{font-size:18px;border-bottom:1px solid var(--line);padding-bottom:4px}.md h3{font-size:16px}
.md code{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code-bg);padding:1px 4px;border-radius:4px}
.md pre{background:var(--code-bg);border:1px solid var(--line-soft);padding:10px;border-radius:4px;overflow-x:auto}
.md pre code{background:none;padding:0;white-space:pre}
.md blockquote{border-left:3px solid var(--line);padding-left:12px;color:var(--muted)}
.md img{max-width:100%}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:4px 8px}
.md ul,.md ol{padding-left:22px}
.md li>input[type=checkbox]{margin-right:6px}
.md.pre{white-space:pre-wrap}
.details .drow{display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--line-soft)}
.details .drow:first-child{border-top:0}
.details .dk{width:92px;flex:none;color:var(--muted);font-size:13px;padding-top:2px}
.details .dv{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px}
.person{display:inline-flex;align-items:center;gap:6px;margin-right:6px}
.w-row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line-soft)}
.w-row:first-child{border-top:0}
.w-row .ic{padding-top:1px}
.w-row b{color:var(--strong);font-weight:600}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:8px 0}
.check input{width:18px;height:18px;margin:1px 0 0;flex:none;accent-color:var(--blue)}
.disc{background:var(--surface);border:1px solid var(--line);border-radius:6px;margin:0 12px 12px;overflow:hidden}
.disc.pending{border-color:var(--orange)}
.disc-where{font-size:12px;color:var(--muted);padding:8px 14px;background:var(--subtle);border-bottom:1px solid var(--line-soft);display:flex;gap:6px;align-items:center;word-break:break-all}
.disc-resolved{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);padding:9px 14px;background:var(--subtle);cursor:pointer}
.disc.resolved:not(.open) .note,.disc.resolved:not(.open) .disc-f{display:none}
.note{display:flex;gap:10px;padding:12px 14px}
.note+.note{border-top:1px solid var(--line-soft)}
.note-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px;margin-bottom:4px}
.note-h b{color:var(--strong)}
.note-acts{margin-left:auto;display:flex;gap:12px}
.disc-f{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line-soft);background:var(--subtle);flex-wrap:wrap;align-items:flex-start}
.disc-f .ed{flex-basis:100%}
.fake-input{flex:1;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 10px;color:var(--muted);min-height:32px;min-width:140px;cursor:text}
.sys{display:flex;gap:8px;align-items:flex-start;padding:6px 16px 6px 22px;font-size:13px;color:var(--muted)}
.sys b{color:var(--text);font-weight:600}
.sys .md{font-size:13px;display:inline}.sys .md p{display:inline;margin:0}.sys .md ul{margin:4px 0 0;padding-left:18px}
.ed{border:1px solid var(--line);border-radius:4px;background:var(--surface);overflow:hidden}
.ed:focus-within{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-bg)}
.ed-tabs{display:flex;border-bottom:1px solid var(--line-soft);background:var(--subtle)}
.ed-tabs button{background:none;border:0;padding:7px 12px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent}
.ed-tabs button.on{color:var(--strong);font-weight:600;border-bottom-color:var(--blue)}
.ed textarea{display:block;width:100%;border:0;outline:0;min-height:110px;padding:10px;font:16px/1.45 inherit;font-family:inherit;background:var(--surface);color:var(--text);resize:vertical}
.ed-prev{padding:10px;min-height:110px}
.ed-hint{font-size:12px;color:var(--muted);padding:5px 10px;border-top:1px solid var(--line-soft)}
.form{padding:4px 16px 24px}
.field{margin:16px 0}
.field>label{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--strong)}
.field>label .link{font-weight:400;margin-left:auto}
input[type=text],input[type=search],input[type=url],input[type=password],input[type=date],select{width:100%;font:16px inherit;font-family:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--text);min-height:42px}
input:focus,select:focus{outline:0;border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-bg)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.searchbar{padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--subtle);border:1px solid var(--line);border-radius:999px;padding:2px 4px 2px 3px;font-size:13px}
.chip button{background:none;border:0;width:22px;height:22px;border-radius:50%;color:var(--muted);font-size:16px;line-height:1}
.pick-res{border:1px solid var(--line);border-radius:4px;margin-top:4px;overflow:hidden}
.pick-res:empty{display:none}
.pick-item{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;border-top:1px solid var(--line-soft);padding:9px 10px}
.pick-item:first-child{border-top:0}
.label-pick{display:flex;flex-wrap:wrap;gap:6px}
.label-pick .label{background:transparent;color:var(--text);border-color:var(--lc,var(--line));padding:5px 10px;cursor:pointer;font-size:13px}
.label-pick .label.on{background:var(--lc);color:var(--lt)}
.diff-sum{display:flex;gap:10px;align-items:center;padding:12px 16px;font-size:14px;font-weight:600;color:var(--strong)}
.adds{color:var(--green);font-weight:600;font-size:13px}.dels{color:var(--red);font-weight:600;font-size:13px}
.file{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:10px}
.file-h{display:flex;width:100%;gap:8px;align-items:center;background:var(--subtle);border:0;padding:10px 12px;text-align:left;position:sticky;top:calc(96px + env(safe-area-inset-top,0px));z-index:5;border-bottom:1px solid var(--line-soft)}
.file-h .path{flex:1;min-width:0;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all;color:var(--strong)}
.chev{display:inline-grid;transition:transform .15s}.chev.open{transform:rotate(90deg)}
table.diff{width:100%;border-collapse:collapse;table-layout:fixed;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
table.diff td{padding:0 6px;vertical-align:top}
table.diff td.ln{width:38px;text-align:right;color:var(--muted);user-select:none;font-size:11px;padding:0 4px}
table.diff td.code{white-space:pre-wrap;word-break:break-all}
.sg{display:inline-block;width:12px;color:var(--muted);user-select:none}
tr.add td{background:var(--add)}tr.add td.ln{background:var(--add-ln)}
tr.del td{background:var(--del)}tr.del td.ln{background:var(--del-ln)}
tr.hunk td{background:var(--hunk);color:var(--muted);padding:4px 6px}
tr.dl{cursor:pointer}
tr.tr-thread td,tr.tr-form td{padding:8px 0;background:var(--bg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;white-space:normal;word-break:normal}
tr.tr-thread .disc{margin:0 8px}
.inline-form{padding:0 8px}
.nodiff{padding:16px;color:var(--muted);font-size:14px}
.review-bar{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;gap:12px;align-items:center;background:var(--surface);border-top:2px solid var(--orange);padding:10px 16px;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
.review-bar .grow b{color:var(--strong)}
.rb-space{height:70px}
.crumbs{padding:10px 16px;font-size:14px;background:var(--surface);border-bottom:1px solid var(--line-soft);word-break:break-all}
.crumbs a{font-weight:500}
.code-view{font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;counter-reset:ln}
.code-view div{white-space:pre-wrap;word-break:break-all;padding-left:52px;position:relative}
.code-view div::before{counter-increment:ln;content:counter(ln);position:absolute;left:0;width:40px;text-align:right;color:var(--muted)}
.log{background:var(--log);color:#e4e4e8;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:12px;white-space:pre-wrap;word-break:break-all;min-height:200px}
.stage{padding:14px 16px 6px;font-size:13px;font-weight:600;color:var(--muted)}
.day{padding:12px 16px 6px;font-size:13px;font-weight:600;color:var(--muted);background:var(--bg)}
.sha{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--subtle);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--text)}
.sheet-wrap{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;border-radius:12px 12px 0 0;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.sheet-btn{display:block;width:100%;background:none;border:0;text-align:left;padding:14px 20px;font-size:16px;color:var(--strong)}
.sheet-btn:active{background:var(--hover)}
.sheet-btn.danger{color:var(--red)}
.sheet-btn.cancel{color:var(--muted);border-top:1px solid var(--line-soft);margin-top:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--strong);color:var(--surface);padding:10px 16px;border-radius:6px;font-size:14px;z-index:60;max-width:90%;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.nav-row{display:flex;gap:12px;align-items:center;padding:13px 16px;border-top:1px solid var(--line-soft);cursor:pointer;color:var(--text)}
.nav-row:first-child{border-top:0}
.nav-row .grow{font-weight:500}
.seg-sm{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg-sm button{background:var(--surface);border:0;padding:5px 10px;font-size:13px;color:var(--muted)}
.seg-sm button.on{background:var(--subtle);color:var(--strong);font-weight:600}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.icon-opt{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--muted);cursor:pointer}
.icon-opt img{width:100%;max-width:68px;aspect-ratio:1;border-radius:22%;box-shadow:0 0 0 1px var(--line)}
.icon-opt.on img{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--blue)}
.icon-opt.on span{color:var(--strong);font-weight:600}
.howto{background:var(--subtle);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin-top:12px;font-size:14px}
.howto ol{margin:6px 0 0;padding-left:20px}
</style>
</head>
<body>
<header class="top">
  <button id="back" class="icon-btn" aria-label="Back" hidden><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>

  <button id="refresh" class="icon-btn" aria-label="Refresh"><svg class="i" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  <button id="more" class="icon-btn" aria-label="More actions" hidden><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/></svg></button>
</header>
<main id="view"></main>
<nav id="nav">
  <a href="#/" data-k=""><svg class="i" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>To-Do<span class="nbadge" id="todo-badge" hidden></span></a>
  <a href="#/mrs/review" data-k="mrs"><svg class="i" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V10a3 3 0 0 0-3-3h-4"/><path d="m13 5-2 2 2 2"/></svg>MRs</a>
  <a href="#/issues/assigned" data-k="issues"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2"/></svg>Issues</a>
  <a href="#/projects/yours" data-k="projects"><svg class="i" viewBox="0 0 24 24"><path d="M3.5 6.5h6l2 2h9v10h-17z"/></svg>Projects</a>
  <a href="#/settings" data-k="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
</nav>
<script>
'use strict';
/* ================= Core helpers ================= */
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const enc = encodeURIComponent;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
function ago(d){ if(!d) return ''; const s=(Date.now()-new Date(d))/1000;
  if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+' min ago'; if(s<86400) return plural(Math.floor(s/3600),'hour')+' ago';
  if(s<2592000) return plural(Math.floor(s/86400),'day')+' ago'; return new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}); }
const dur = s => { if(s==null) return ''; s=Math.round(s); return s<60 ? s+'s' : Math.floor(s/60)+'m '+(s%60)+'s'; };
const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}, del(k){try{localStorage.removeItem(k)}catch{}} };
let cfg = { host: store.get('gl_host') || '', token: store.get('gl_token') || '' };
let me = null, navId = 0, acts = {}, inputs = {}, menuItems = null, lastTab = '', CUR = {}, DS = null;
const projCache = {}, openSets = {};
const baseUrl = () => cfg.host.replace(/\/+$/, '');

function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.append(t); setTimeout(()=>t.remove(),2800); }
function openExt(u){ window.open(u, '_blank', 'noopener'); }
function go(h){ location.hash = h.replace(/^#/, ''); }

async function api(path, { method = 'GET', body, raw } = {}){
  const res = await fetch(baseUrl() + '/api/v4' + path, { method,
    headers: { 'PRIVATE-TOKEN': cfg.token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined });
  if (!res.ok) {
    let msg = '';
    try { const j = await res.json(); msg = j.message || j.error || '';
      if (typeof msg !== 'string') msg = Array.isArray(msg) ? msg.join(', ') : Object.entries(msg).map(([k,v]) => `${k} ${[].concat(v).join(', ')}`).join('; '); } catch {}
    const e = new Error(msg || ('HTTP ' + res.status)); e.status = res.status; throw e;
  }
  if (raw) return res.text();
  if (res.status === 204) return null;
  const t = await res.text(); return t ? JSON.parse(t) : null;
}
async function all(path, maxPages = 5){
  const sep = path.includes('?') ? '&' : '?'; let out = [];
  for (let p = 1; p <= maxPages; p++) { const r = await api(`${path}${sep}per_page=100&page=${p}`); out = out.concat(r || []); if (!r || r.length < 100) break; }
  return out;
}
async function getMe(){ if (!me) me = await api('/user'); return me; }
async function proj(pid){ if (!projCache[pid]) projCache[pid] = await api('/projects/' + enc(pid)); return projCache[pid]; }
function errMsg(e){ return !e.status ? 'Can’t reach GitLab. Is the VPN on?' : e.status === 401 ? 'Token rejected. Check it in Settings.' : e.status === 403 ? 'You don’t have permission to do that.' : e.message; }
async function busy(el, fn, ok){
  if (el) { if (el.disabled) return false; el.disabled = true; }
  try { await fn(); if (ok) toast(ok); return true; } catch (e) { toast(errMsg(e)); return false; }
  finally { if (el && el.isConnected) el.disabled = false; }
}
function sheet(items){
  const o = document.createElement('div'); o.className = 'sheet-wrap';
  o.innerHTML = `<div class="sheet" role="menu">${items.map((it,i)=>`<button class="sheet-btn ${it.danger?'danger':''}" data-i="${i}">${esc(it.label)}</button>`).join('')}<button class="sheet-btn cancel" data-i="-1">Cancel</button></div>`;
  o.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (e.target === o || b) { e.stopPropagation(); o.remove(); if (b && +b.dataset.i >= 0) items[+b.dataset.i].fn(); } });
  document.body.append(o);
}

/* ================= Rendering helpers ================= */
const IC = {
  branch:'<circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="7" r="2"/><path d="M6 7v10M18 9c0 5-7 4-11 8"/>',
  comment:'<path d="M4 5h16v11H9l-5 4z"/>', chev:'<path d="m9 6 6 6-6 6"/>', file:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/>',
  folder:'<path d="M3.5 6.5h6l2 2h9v10h-17z"/>', commit:'<circle cx="12" cy="12" r="3.5"/><path d="M3 12h5.5M15.5 12H21"/>',
  pipeline:'<circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/><path d="M7.2 12h2.6M14.2 12h2.6"/>',
  mr:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5v7M18 15.5V10a3 3 0 0 0-3-3h-4"/>',
  issue:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2"/>', check:'<path d="m5 12 5 5 9-10"/>',
  approve:'<circle cx="12" cy="12" r="8.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/>', merge:'<circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M6 8.5v7M8 7.5c3 3 6 4.5 7.5 4.5"/>',
  ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/>', copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', retry:'<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>', play:'<path d="M8 5v14l11-7z"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="1"/>', lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  warn:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17v.5"/>', label:'<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>', clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/>'
};
const ic = (n, s = 18) => `<svg class="i" viewBox="0 0 24 24" style="width:${s}px;height:${s}px" aria-hidden="true">${IC[n]||''}</svg>`;
function av(u, s = 24, sq = false){
  if (!u) return '';
  const n = u.name || u.username || '?';
  const init = n.split(/\s+/).filter(Boolean).map(x => x[0]).slice(0, sq ? 1 : 2).join('').toUpperCase();
  let h = 0; for (const c of n) h = (h * 31 + c.charCodeAt(0)) | 0;
  let src = u.avatar_url || ''; if (src.startsWith('/')) src = baseUrl() + src;
  return `<span class="av av${Math.abs(h)%6}${sq?' sq':''}" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.42)}px" title="${esc(n)}">${esc(init)}${src?`<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">`:''}</span>`;
}
const CI = { success:['ok','<path d="m5 12 5 5 9-10"/>'], failed:['bad','<path d="M6 6l12 12M18 6 6 18"/>'], running:['run',''],
  pending:['warn','<path d="M9 7v10M15 7v10"/>'], created:['neutral',''], waiting_for_resource:['warn','<path d="M9 7v10M15 7v10"/>'],
  preparing:['warn','<path d="M9 7v10M15 7v10"/>'], scheduled:['neutral','<path d="M12 7v5l3 2"/>'], canceled:['neutral','<path d="M6 18 18 6"/>'],
  skipped:['neutral','<path d="m6 6 6 6-6 6M13 6l6 6-6 6"/>'], manual:['neutral','<path d="M8 5v14l11-7z"/>'] };
const ciText = s => ({success:'passed',failed:'failed',running:'running',pending:'pending',canceled:'canceled',skipped:'skipped',manual:'manual action',created:'created',scheduled:'scheduled',waiting_for_resource:'waiting',preparing:'preparing'}[s] || s);
const ci = s => { const [c, g] = CI[s] || ['neutral','']; return `<span class="ci ci-${c}" title="${esc(ciText(s))}" role="img" aria-label="${esc(ciText(s))}">${g?`<svg viewBox="0 0 24 24">${g}</svg>`:''}</span>`; };
const stateBadge = s => { const [l, c] = ({opened:['Open','ok'],merged:['Merged','merged'],closed:['Closed','bad'],locked:['Locked','neutral']})[s] || [s,'neutral']; return `<span class="badge b-${c}">${esc(l)}</span>`; };
function labelsHtml(ls){
  if (!ls || !ls.length) return '';
  return `<div class="labels">${ls.map(l => typeof l === 'string' ? `<span class="label">${esc(l)}</span>` : `<span class="label" style="--lc:${esc(l.color)};--lt:${esc(l.text_color)}">${esc(l.name)}</span>`).join('')}</div>`;
}
const empty = (t, s = '') => `<div class="empty"><div class="empty-t">${esc(t)}</div>${s?`<p>${esc(s)}</p>`:''}</div>`;
const tabs = (items, active) => `<div class="tabs" role="tablist">${items.map(i => `<button role="tab" aria-selected="${i.k===active}" class="${i.k===active?'on':''}" data-act="tab" data-h="${esc(i.h)}">${esc(i.label)}${i.count!=null?`<span class="count">${esc(i.count)}</span>`:''}</button>`).join('')}</div>`;
function md(text, pr){
  if (!text) return '';
  if (window.marked && window.DOMPurify) {
    let h = DOMPurify.sanitize(marked.parse(text, { gfm: true, breaks: true, mangle: false, headerIds: false }));
    if (pr) h = h.replace(/(src|href)="\/uploads\//g, `$1="${pr.web_url}/uploads/`);
    h = h.replace(/(src|href)="\/(?!\/)/g, `$1="${baseUrl()}/`);
    return `<div class="md">${h}</div>`;
  }
  return `<div class="md pre">${esc(text)}</div>`;
}
let edSeq = 0;
function editor(val = '', ph = 'Write a comment…', id){
  id = id || 'ed' + (++edSeq);
  return `<div class="ed" id="${id}"><div class="ed-tabs"><button type="button" class="on" data-act="edtab" data-m="w">Write</button><button type="button" data-act="edtab" data-m="p">Preview</button></div><textarea placeholder="${esc(ph)}" aria-label="${esc(ph)}">${esc(val)}</textarea><div class="ed-prev" hidden></div><div class="ed-hint">Supports Markdown and quick actions like /assign_reviewer</div></div>`;
}
const edVal = root => { const t = root && $('textarea', root); return t ? t.value.trim() : ''; };
const DRAFT_RE = /^\s*(\[draft\]|\(draft\)|draft:|draft\s+-|draft\b)\s*/i;
const setDraft = (t, on) => { const c = t.replace(DRAFT_RE, ''); return on ? 'Draft: ' + c : c; };
function person(u){ return `<span class="person">${av(u,22)}<span>${esc(u.name)}</span></span>`; }

/* ================= Diff helpers ================= */
function parseDiff(txt){
  const rows = []; let o = 0, n = 0; const lines = txt.split('\n'); if (lines[lines.length-1] === '') lines.pop();
  for (const l of lines) {
    if (l.startsWith('@@')) { const m = /@@ -(\d+)(?:,\d+)? \+(\d+)/.exec(l); if (m) { o = +m[1]; n = +m[2]; } rows.push({ t:'hunk', s:l }); }
    else if (l.startsWith('+')) rows.push({ t:'add', s:l.slice(1), n:n++ });
    else if (l.startsWith('-')) rows.push({ t:'del', s:l.slice(1), o:o++ });
    else if (l.startsWith('\\')) {}
    else rows.push({ t:'ctx', s:l.slice(1), o:o++, n:n++ });
  }
  return rows;
}
const threadKey = pos => pos.new_line ? `${pos.new_path}|n${pos.new_line}` : `${pos.old_path}|o${pos.old_line}`;
function filesHtml(files, opts){
  const parsed = files.map(f => { const rows = parseDiff(f.diff || ''); let a = 0, d = 0; for (const r of rows) { if (r.t === 'add') a++; else if (r.t === 'del') d++; } return { f, rows, a, d }; });
  let set = openSets[opts.key];
  if (!set) { set = openSets[opts.key] = new Set(); parsed.forEach((x, i) => { if (x.rows.length <= 500 && i < 20) set.add(i); }); }
  DS = { ...opts, parsed, set, tmap: opts.tmap || {} };
  const A = parsed.reduce((s, x) => s + x.a, 0), D = parsed.reduce((s, x) => s + x.d, 0);
  return `<div class="diff-sum"><span class="grow">${plural(parsed.length,'file')} changed</span><span class="adds">+${A}</span><span class="dels">−${D}</span></div>` +
    parsed.map((x, i) => { const open = set.has(i); const path = x.f.renamed_file ? `${x.f.old_path} → ${x.f.new_path}` : x.f.new_path;
      return `<div class="file" id="file-${i}"><button class="file-h" data-act="file" data-i="${i}" aria-expanded="${open}"><span class="chev ${open?'open':''}">${ic('chev',14)}</span><span class="path">${esc(path)}</span>${x.f.new_file?'<span class="badge b-ok">new</span>':''}${x.f.deleted_file?'<span class="badge b-bad">deleted</span>':''}<span class="adds">+${x.a}</span><span class="dels">−${x.d}</span></button><div class="file-b"${open?'':' hidden'}>${open?diffTable(i):''}</div></div>`; }).join('');
}
function diffTable(i){
  const x = DS.parsed[i];
  if (!x.rows.length) return `<div class="nodiff">${x.f.too_large || x.f.collapsed ? 'This diff is too large to show here.' : 'No text changes to show (binary file or permissions change).'}</div>`;
  let h = '<table class="diff">';
  x.rows.forEach((r, ri) => {
    if (r.t === 'hunk') { h += `<tr class="hunk"><td class="ln"></td><td class="ln"></td><td class="code">${esc(r.s)}</td></tr>`; return; }
    h += `<tr class="dl ${r.t}"${DS.comment ? ` data-act="line" data-f="${i}" data-r="${ri}"` : ''}><td class="ln">${r.o ?? ''}</td><td class="ln">${r.n ?? ''}</td><td class="code"><span class="sg">${r.t==='add'?'+':r.t==='del'?'−':' '}</span>${esc(r.s)}</td></tr>`;
    const k = r.t === 'del' ? `${x.f.old_path}|o${r.o}` : `${x.f.new_path}|n${r.n}`;
    for (const it of (DS.tmap[k] || [])) h += `<tr class="tr-thread"><td colspan="3">${it.d ? discHtml(it.d) : draftHtml(it.draft)}</td></tr>`;
  });
  return h + '</table>';
}

/* ================= Discussions ================= */
function noteHtml(n){
  const own = me && n.author && n.author.id === me.id;
  return `<div class="note" id="note-${n.id}">${av(n.author,32)}<div class="grow"><div class="note-h"><b>${esc(n.author.name)}</b><span class="meta">@${esc(n.author.username)} · ${ago(n.created_at)}${n.last_edited_at?' · edited':''}</span>${own?`<span class="note-acts"><button class="link" data-act="editnote" data-n="${n.id}">Edit</button><button class="link danger" data-act="delnote" data-n="${n.id}">Delete</button></span>`:''}</div><div class="note-b" data-raw="${esc(n.body)}">${md(n.body, CUR.pr)}</div></div></div>`;
}
function sysHtml(n){ return `<div class="sys">${av(n.author,20)}<div class="grow"><b>${esc(n.author.name)}</b> ${md(n.body, CUR.pr)} <span>· ${ago(n.created_at)}</span></div></div>`; }
function discHtml(d){
  const first = d.notes[0];
  if (d.individual_note && first.system) return sysHtml(first);
  const resolvable = d.notes.some(n => n.resolvable);
  const resolved = resolvable && d.notes.every(n => !n.resolvable || n.resolved);
  const pos = first.position;
  const where = pos && (pos.new_line || pos.old_line) ? `<div class="disc-where"${CUR.isMr?` data-act="tab" data-h="#/p/${CUR.pid}/mr/${CUR.iid}/changes"`:''}>${ic('file',14)} ${esc(pos.new_path || pos.old_path)} · line ${pos.new_line || pos.old_line}</div>` : '';
  const resolver = d.notes.find(n => n.resolved_by)?.resolved_by;
  return `<div class="disc${resolved?' resolved':''}" id="d-${d.id}">${where}${resolved?`<div class="disc-resolved" data-act="dtoggle">${ic('check',14)}<span class="grow">Thread resolved${resolver?' by '+esc(resolver.name):''} · ${plural(d.notes.length,'comment')}</span><span class="link">Show</span></div>`:''}${d.notes.filter(n => !n.system).map(noteHtml).join('')}<div class="disc-f" id="df-${d.id}"><button class="fake-input" data-act="reply" data-d="${d.id}">Reply…</button>${resolvable?`<button class="btn sm" data-act="resolve" data-d="${d.id}" data-v="${resolved?'false':'true'}">${resolved?'Unresolve thread':'Resolve thread'}</button>`:''}</div></div>`;
}
function draftHtml(dn){
  const pos = dn.position && (dn.position.new_line || dn.position.old_line) ? dn.position : null;

let actFilter = 'all';
function activityHtml(discs){

  ['p/:pid/pipelines', vPipelines], ['p/:pid/pipeline/:id', vPipeline], ['p/:pid/job/:id', vJob]

function match(pat, parts){
  const pp = pat ? pat.split('/') : [], params = {};
  for (let i = 0; i < pp.length; i++) {
    const p = pp[i];
    if (p[0] === '*') { params[p.slice(1)] = parts.slice(i).join('/'); return params; }
    if (i >= parts.length) return null;
    if (p[0] === ':') params[p.slice(1)] = parts[i]; else if (p !== parts[i]) return null;
  }
  return parts.length === pp.length ? params : null;
}
function head(t, sub = '', menu = null){ $('#ttl').textContent = t; const s = $('#sub'); s.textContent = sub; s.hidden = !sub; menuItems = menu; $('#more').hidden = !menu; document.title = t + ' · GitLab'; }
function errHtml(e){
  const net = !e.status;
  return `<div class="empty"><div class="empty-t">${net?'Can’t reach GitLab':e.status===401?'Your token was rejected':e.status===404?'Not found':'Something went wrong'}</div><p>${esc(net?'Check that this phone is connected to the company VPN, then try again.':e.status===401?'It may have expired or been revoked. Add a new token in Settings.':e.message)}</p><div class="btns center"><button class="btn" data-act="retry">Try again</button>${e.status===401?'<a class="btn confirm" href="#/settings">Open Settings</a>':''}</div></div>`;
}
async function route(keep = false){
  const y = window.scrollY, id = ++navId; acts = {}; inputs = {};
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  if ((!cfg.host || !cfg.token) && parts[0] !== 'settings') { location.replace('#/settings'); return; }
  let fn = vHome, params = {};
  for (const [pat, f] of routes) { const m = match(pat, parts); if (m) { fn = f; params = m; break; } }
  if (parts[0] !== 'p') lastTab = parts[0] || '';
  $$('#nav a').forEach(a => a.classList.toggle('on', a.dataset.k === lastTab));
  $('#back').hidden = parts[0] !== 'p';
  if (!keep) { $('#view').innerHTML = '<div class="loading"><span class="spinner" role="status" aria-label="Loading"></span></div>'; window.scrollTo(0, 0); }
  const R = h => { if (id !== navId) return false; $('#view').innerHTML = h; return true; };
  try {
    if (cfg.token && fn !== vSettings) await getMe();
    await fn({ p: params, R, id, keep });
    if (keep && id === navId) window.scrollTo(0, y);
  } catch (e) { if (id === navId) { $('#view').innerHTML = errHtml(e); } }
}

/* ================= Merge request ================= */
const MERGE_MSG = { mergeable:['ok','Ready to merge'], ci_still_running:['warn','Pipeline is still running'], ci_must_pass:['bad','Pipeline must succeed before merging'],
  not_approved:['warn','Approval is required before merging'], discussions_not_resolved:['warn','All threads must be resolved before merging'], draft_status:['warn','Merge blocked: this merge request is a draft'],
  conflict:['bad','Merge conflicts must be resolved. Resolve them in GitLab or locally.'], broken_status:['bad','The source branch can’t be merged cleanly'], need_rebase:['warn','The source branch must be rebased onto the target branch'],
  not_open:['neutral','Merge request is not open'], blocked_status:['warn','Merge is blocked by another merge request'], checking:['neutral','Checking whether this can be merged…'], unchecked:['neutral','Checking whether this can be merged…'],
  preparing:['neutral','Preparing the merge request…'], requested_changes:['warn','A reviewer requested changes'], jira_association_missing:['warn','A linked Jira issue is required'], external_status_checks:['warn','External status checks must pass'], security_policy_violations:['warn','Security policy checks must pass'] };
const RUNNING = ['running','pending','created','waiting_for_resource','preparing','scheduled'];
async function vMr({ p, R }){
  const tab = p.tab || 'overview', B = `/projects/${p.pid}/merge_requests/${p.iid}`;
  const [pr, m] = await Promise.all([proj(p.pid), api(B)]);
  const drafts = await api(`${B}/draft_notes`).catch(() => []);
  CUR = { pr, pid: pr.id, iid: m.iid, B, isMr: true, m, drafts };
  const draftFlag = m.draft || m.work_in_progress;
  head('!' + m.iid, pr.path_with_namespace, [
    { label:'Edit', fn:() => go(`#/p/${pr.id}/mr/${m.iid}/edit`) },
    ...(m.state === 'opened' ? [{ label: draftFlag ? 'Mark as ready' : 'Mark as draft', fn:() => busy(null, async () => { await api(B, { method:'PUT', body:{ title:setDraft(m.title, !draftFlag) } }); await reload(); }, draftFlag ? 'Marked as ready' : 'Marked as draft') }] : []),
    { label:'Copy source branch name', fn:() => gacts.copy({ dataset:{ v:m.source_branch } }) },
    { label:'Copy link', fn:() => gacts.copy({ dataset:{ v:m.web_url } }) },
    { label:'Open in GitLab', fn:() => openExt(m.web_url) },
    ...(m.state === 'opened' ? [{ label:'Close merge request', danger:true, fn:() => confirm('Close this merge request?') && busy(null, async () => { await api(B, { method:'PUT', body:{ state_event:'close' } }); await reload(); }, 'Merge request closed') }] :
      m.state === 'closed' ? [{ label:'Reopen merge request', fn:() => busy(null, async () => { await api(B, { method:'PUT', body:{ state_event:'reopen' } }); await reload(); }, 'Merge request reopened') }] : [])
  ]);
  const header = `<div class="page-h"><div>${stateBadge(m.state)} ${draftFlag?'<span class="badge b-neutral">Draft</span>':''}</div><h1>${esc(m.title)}</h1><div class="meta">${av(m.author,20)} <b style="color:var(--text)">${esc(m.author.name)}</b> requested to merge <button class="branch" data-act="copy" data-v="${esc(m.source_branch)}" aria-label="Copy branch name ${esc(m.source_branch)}">${esc(m.source_branch)}</button> into <span class="branch">${esc(m.target_branch)}</span> · ${ago(m.created_at)}</div></div>` +
    tabs([{ k:'overview', label:'Overview', count:m.user_notes_count, h:`#/p/${pr.id}/mr/${m.iid}` }, { k:'commits', label:'Commits', h:`#/p/${pr.id}/mr/${m.iid}/commits` }, { k:'pipelines', label:'Pipelines', h:`#/p/${pr.id}/mr/${m.iid}/pipelines` }, { k:'changes', label:'Changes', count:m.changes_count, h:`#/p/${pr.id}/mr/${m.iid}/changes` }], tab);
  const bar = drafts.length ? `<div class="rb-space"></div><div class="review-bar"><div class="grow"><b>${plural(drafts.length,'pending comment')}</b><div class="meta">Only you can see these until you submit.</div></div><button class="btn confirm" data-act="submitreview">Submit review</button></div>` : '';
  let body = '';
  if (tab === 'overview') body = await mrOverview(m, pr, B, drafts);
  else if (tab === 'commits') body = commitRows(pr.id, await all(`${B}/commits`, 3));
  else if (tab === 'pipelines') { const pls = await api(`${B}/pipelines`);
    body = `<div class="toolbar"><span class="grow meta">${plural(pls.length,'pipeline')}</span>${m.state==='opened'?'<button class="btn sm" data-act="runmrp">'+ic('play',14)+' Run pipeline</button>':''}</div>` + (pls.length ? `<div class="list">${pls.map(pl => pipeRow(pr.id, pl)).join('')}</div>` : empty('No pipelines yet'));
    acts.runmrp = el => busy(el, async () => { await api(`${B}/pipelines`, { method:'POST' }); await reload(); }, 'Pipeline started'); }
  else if (tab === 'changes') {

    const discs = await all(`${B}/discussions`, 5); const tmap = {};
    for (const d of discs) { const pos = d.notes[0].position; if (pos && pos.position_type === 'text' && (pos.new_line || pos.old_line)) (tmap[threadKey(pos)] ||= []).push({ d }); }

async function mrOverview(m, pr, B, drafts){

  if (m.state === 'merged') w += `<div class="w-row"><span class="ic" style="color:var(--purple)">${ic('merge')}</span><div class="grow"><b>Merged by ${esc(m.merged_by?.name || m.merge_user?.name || '')} ${ago(m.merged_at)}</b>${(m.merge_commit_sha||m.squash_commit_sha)?`<div class="meta">Commit <a href="#/p/${pr.id}/commit/${m.merge_commit_sha||m.squash_commit_sha}">${esc((m.merge_commit_sha||m.squash_commit_sha).slice(0,8))}</a></div>`:''}</div></div>`;

    <div class="drow"><div class="dk">Reviewers</div><div class="dv">${m.reviewers?.length ? m.reviewers.map(u => person(u) + (approvedBy.some(a => a.id === u.id) ? `<span style="color:var(--green)">${ic('check',14)}</span>` : '')).join('') : '<span class="meta">None</span>'}</div></div>
    <div class="drow"><div class="dk">Labels</div><div class="dv">${m.labels?.length ? labelsHtml(m.labels).replace('class="labels"','class="labels" style="margin:0"') : '<span class="meta">None</span>'}</div></div>
    ${m.milestone?`<div class="drow"><div class="dk">Milestone</div><div class="dv">${esc(m.milestone.title)}</div></div>`:''}</div>`;
  const pending = drafts.length ? `<div class="section-h">Your pending comments</div>${drafts.map(draftHtml).join('')}` : '';
  return `<div class="card"><div class="card-b">${m.description ? md(m.description, pr) : '<span class="meta">No description provided.</span>'}</div></div>` +

}
async function vMrForm({ p, R }){
  const pr = await proj(p.pid); const isNew = !p.iid;
  const mr = isNew ? null : await api(`/projects/${pr.id}/merge_requests/${p.iid}`);
  head(isNew ? 'New merge request' : `Edit !${mr.iid}`, pr.path_with_namespace);
  CUR = { pr, pid: pr.id };
  let branches; try { branches = await api(`/projects/${pr.id}/repository/branches?per_page=100&sort=updated_desc`); } catch { branches = await api(`/projects/${pr.id}/repository/branches?per_page=100`); }
  const labels = await all(`/projects/${pr.id}/labels`, 2).catch(() => []);
  const src = mr ? mr.source_branch : (p.source || ''), tgt = mr ? mr.target_branch : pr.default_branch;
  const names = branches.map(b => b.name); [src, tgt].forEach(n => { if (n && !names.includes(n)) names.unshift(n); });
  Object.assign(PICK, { pid: pr.id, assignees: mr ? [...(mr.assignees || [])] : [], reviewers: mr ? [...(mr.reviewers || [])] : [], labels: new Set(mr ? mr.labels : []), res: {} });
  const draftFlag = mr ? !!(mr.draft || mr.work_in_progress) : false;
  const opts = (sel, ph) => (ph ? `<option value="">${esc(ph)}</option>` : '') + names.map(n => `<option${n === sel ? ' selected' : ''}>${esc(n)}</option>`).join('');
  if (!R(`<div class="form">
    <div class="field"><label for="f-src">Source branch</label>${isNew ? `<select id="f-src">${opts(src, 'Select source branch')}</select>` : `<div><span class="branch">${esc(src)}</span></div>`}</div>
    <div class="field"><label for="f-tgt">Target branch</label><select id="f-tgt">${opts(tgt)}</select></div>
    <div class="field"><label for="f-title">Title</label><input type="text" id="f-title" value="${esc(mr ? setDraft(mr.title, false) : '')}" placeholder="Describe the change in a few words"></div>
    <label class="check"><input type="checkbox" id="f-draft"${draftFlag ? ' checked' : ''}> <span>Mark as draft<br><span class="meta">Drafts can’t be merged until they’re marked ready.</span></span></label>
    <div class="field"><label>Description</label>${editor(mr ? mr.description || '' : '', 'Describe the goal of the changes and what reviewers should know.', 'f-desc')}</div>
    <div class="field"><label>Assignees <button type="button" class="link" data-act="assignme">Assign to me</button></label>${picker('assignees')}</div>
    <div class="field"><label>Reviewers</label>${picker('reviewers')}</div>
    <div class="field"><label>Labels</label><div class="label-pick">${labels.length ? labels.map(l => `<button type="button" class="label${PICK.labels.has(l.name)?' on':''}" aria-pressed="${PICK.labels.has(l.name)}" data-act="lbl" data-v="${esc(l.name)}" style="--lc:${esc(l.color)};--lt:${esc(l.text_color)}">${esc(l.name)}</button>`).join('') : '<span class="meta">This project has no labels.</span>'}</div></div>
    <label class="check"><input type="checkbox" id="f-del"${mr ? (mr.force_remove_source_branch ? ' checked' : '') : ' checked'}> Delete source branch when merge request is accepted</label>
    <label class="check"><input type="checkbox" id="f-squash"${mr?.squash ? ' checked' : ''}> Squash commits when merge request is accepted</label>
    <div class="btns" style="margin-top:20px"><button class="btn confirm" data-act="save">${isNew ? 'Create merge request' : 'Save changes'}</button><button class="btn" data-act="cancel">Cancel</button></div></div>`)) return;
  if (isNew) {
    let touched = false; $('#f-title').addEventListener('input', () => touched = true);
    const fill = () => { const b = branches.find(x => x.name === $('#f-src').value); if (!touched && b) $('#f-title').value = b.commit?.title || b.name.replace(/[-_/]+/g, ' '); };
    $('#f-src').onchange = fill; if (src) fill();
  }
  acts = {
    cancel: () => history.back(),
    async save(el){
      const title = $('#f-title').value.trim(), source = isNew ? $('#f-src').value : src, target = $('#f-tgt').value;
      if (!source) return toast('Choose a source branch'); if (!title) return toast('Add a title'); if (source === target) return toast('Source and target branches must be different');
      const body = { target_branch: target, title: setDraft(title, $('#f-draft').checked), description: edVal($('#f-desc')), assignee_ids: PICK.assignees.map(u => u.id), reviewer_ids: PICK.reviewers.map(u => u.id), labels: [...PICK.labels].join(','), remove_source_branch: $('#f-del').checked, squash: $('#f-squash').checked };
      let res; const ok = await busy(el, async () => { res = isNew ? await api(`/projects/${pr.id}/merge_requests`, { method:'POST', body:{ source_branch: source, ...body } }) : await api(`/projects/${pr.id}/merge_requests/${mr.iid}`, { method:'PUT', body }); }, isNew ? 'Merge request created' : 'Changes saved');
      if (ok) location.replace(`#/p/${pr.id}/mr/${res.iid}`);
    }
  };
}

/* ================= Pipelines ================= */
function pipeRow(pid, pl){ return `<div class="item" data-go="#/p/${pid}/pipeline/${pl.id}">${ci(pl.status)}<div class="grow"><div class="title">#${pl.id} <span class="meta" style="font-weight:400">${esc(ciText(pl.status))}</span></div><div class="meta">${ic('branch',13)} ${esc(pl.ref)} · <span class="sha">${esc(pl.sha.slice(0,8))}</span>${pl.source?' · '+esc(pl.source.replace(/_/g,' ')):''}</div></div><span class="meta nowrap">${ago(pl.updated_at || pl.created_at)}</span></div>`; }
async function vPipelines({ p, R }){
  const pr = await proj(p.pid); head('Pipelines', pr.path_with_namespace);
  const pls = await api(`/projects/${pr.id}/pipelines?per_page=40`);
  if (!R(`<div class="toolbar"><span class="grow meta">Most recent first</span><button class="btn confirm" data-act="run">${ic('play',14)} Run pipeline</button></div>` + (pls.length ? `<div class="list">${pls.map(pl => pipeRow(pr.id, pl)).join('')}</div>` : empty('No pipelines yet')))) return;
  acts.run = el => { const ref = prompt('Run a pipeline on which branch or tag?', pr.default_branch); if (!ref) return;
    busy(el, async () => { const pl = await api(`/projects/${pr.id}/pipeline`, { method:'POST', body:{ ref } }); go(`#/p/${pr.id}/pipeline/${pl.id}`); }, 'Pipeline started'); };
}
async function vPipeline({ p, R, id }){
  const pr = await proj(p.pid);
  const [pl, jobs, bridges] = await Promise.all([api(`/projects/${pr.id}/pipelines/${p.id}`), all(`/projects/${pr.id}/pipelines/${p.id}/jobs`, 3), api(`/projects/${pr.id}/pipelines/${p.id}/bridges`).catch(() => [])]);
  head('Pipeline #' + pl.id, pr.path_with_namespace, [{ label:'Open in GitLab', fn:() => openExt(pl.web_url) }]);
  const js = [...jobs, ...bridges.map(b => ({ ...b, bridge:true }))].sort((a, b) => a.id - b.id);
  const stages = [...new Set(js.map(j => j.stage))];
  const jact = j => j.bridge ? '' : ['failed','canceled','success'].includes(j.status) ? `<button class="icon-btn" data-act="jretry" data-id="${j.id}" aria-label="Retry ${esc(j.name)}">${ic('retry')}</button>` : j.status === 'manual' ? `<button class="icon-btn" data-act="jplay" data-id="${j.id}" aria-label="Run ${esc(j.name)}">${ic('play')}</button>` : RUNNING.includes(j.status) ? `<button class="icon-btn" data-act="jcancel" data-id="${j.id}" aria-label="Cancel ${esc(j.name)}">${ic('stop')}</button>` : '';
  if (!R(`<div class="page-h"><div>${ci(pl.status)} <b>${esc(ciText(pl.status))}</b></div><div class="meta" style="margin-top:6px">${ic('branch',13)} ${esc(pl.ref)} · <a href="#/p/${pr.id}/commit/${pl.sha}" class="sha">${esc(pl.sha.slice(0,8))}</a>${pl.user?` · triggered by ${esc(pl.user.name)}`:''} · ${ago(pl.created_at)}${pl.duration?` · took ${dur(pl.duration)}`:''}</div>
    <div class="btns">${pl.status==='failed'||pl.status==='canceled'?'<button class="btn" data-act="retry2">'+ic('retry',14)+' Retry failed jobs</button>':''}${RUNNING.includes(pl.status)?'<button class="btn danger-o" data-act="cancel">Cancel pipeline</button>':''}</div></div>` +
    stages.map(s => `<div class="stage">${esc(s)}</div><div class="list">${js.filter(j => j.stage === s).map(j => `<div class="item" ${j.bridge ? (j.downstream_pipeline ? `data-go="#/p/${j.downstream_pipeline.project_id}/pipeline/${j.downstream_pipeline.id}"` : '') : `data-go="#/p/${pr.id}/job/${j.id}"`}>${ci(j.status)}<div class="grow"><div class="title" style="font-weight:500">${esc(j.name)}${j.bridge?' <span class="badge b-neutral">downstream</span>':''}${j.allow_failure&&j.status==='failed'?' <span class="badge b-warn">allowed to fail</span>':''}</div><div class="meta">${esc(ciText(j.status))}${j.duration?' · '+dur(j.duration):''}</div></div>${jact(j)}</div>`).join('')}</div>`).join(''))) return;
  const J = `/projects/${pr.id}/jobs/`;
  acts = {
    retry2: el => busy(el, async () => { await api(`/projects/${pr.id}/pipelines/${pl.id}/retry`, { method:'POST' }); await reload(); }, 'Retrying failed jobs'),
    cancel: el => confirm('Cancel this pipeline?') && busy(el, async () => { await api(`/projects/${pr.id}/pipelines/${pl.id}/cancel`, { method:'POST' }); await reload(); }, 'Pipeline canceled'),
    jretry: el => busy(el, async () => { await api(J + el.dataset.id + '/retry', { method:'POST' }); await reload(); }, 'Job retried'),
    jplay: el => busy(el, async () => { await api(J + el.dataset.id + '/play', { method:'POST' }); await reload(); }, 'Job started'),
    jcancel: el => busy(el, async () => { await api(J + el.dataset.id + '/cancel', { method:'POST' }); await reload(); }, 'Job canceled')
  };
  if (RUNNING.includes(pl.status)) setTimeout(() => { if (id === navId) reload(); }, 10000);
}
async function vJob({ p, R, id, keep }){
  const pr = await proj(p.pid), J = `/projects/${pr.id}/jobs/${p.id}`;
  const j = await api(J); head(j.name, `Job #${j.id} · ${pr.path_with_namespace}`, [{ label:'Open in GitLab', fn:() => openExt(j.web_url) }]);
  let log = ''; try { log = await api(J + '/trace', { raw:true }); } catch {}
  log = log.replace(/\x1b\[[0-9;]*[A-Za-z]/g, '').replace(/section_(start|end):\d+:[^\r\n]*?(\r|$)/gm, '').split('\n').map(l => l.split('\r').filter(Boolean).pop() || '').join('\n');
  const btns = ['failed','canceled','success'].includes(j.status) ? `<button class="btn" data-act="retry3">${ic('retry',14)} Retry</button>` : j.status === 'manual' ? `<button class="btn confirm" data-act="play">${ic('play',14)} Run job</button>` : RUNNING.includes(j.status) ? `<button class="btn danger-o" data-act="cancel">Cancel job</button>` : '';
  if (!R(`<div class="page-h"><div>${ci(j.status)} <b>${esc(ciText(j.status))}</b>${j.duration?` <span class="meta">· ${dur(j.duration)}</span>`:''}</div><div class="meta" style="margin-top:6px">Stage ${esc(j.stage)} · ${ic('branch',13)} ${esc(j.ref)}${j.runner?` · runner ${esc(j.runner.description || j.runner.id)}`:''}</div>${btns?`<div class="btns">${btns}<button class="btn tertiary" data-act="bottom">Jump to end</button></div>`:''}</div><div class="log">${esc(log.slice(-200000)) || 'No log output yet.'}</div>`)) return;
  if (!keep) window.scrollTo(0, document.body.scrollHeight);
  acts = {
    bottom: () => window.scrollTo(0, document.body.scrollHeight),
    retry3: el => busy(el, async () => { const n = await api(J + '/retry', { method:'POST' }); location.replace(`#/p/${pr.id}/job/${n.id}`); }, 'Job retried'),
    play: el => busy(el, async () => { await api(J + '/play', { method:'POST' }); await reload(); }, 'Job started'),
    cancel: el => busy(el, async () => { await api(J + '/cancel', { method:'POST' }); await reload(); }, 'Job canceled')
  };
  if (RUNNING.includes(j.status)) setTimeout(() => { if (id === navId) reload(); }, 5000);
}

/* ================= Wiring ================= */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (a) { const f = acts[a.dataset.act] || gacts[a.dataset.act]; if (f) { e.preventDefault(); e.stopPropagation(); f(a, e); return; } }
  const x = e.target.closest('[data-ext]'); if (x) { e.preventDefault(); openExt(x.dataset.ext); return; }
  const g = e.target.closest('[data-go]'); if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const l = e.target.closest('.md a[href]'); if (l) { e.preventDefault(); if (l.getAttribute('href').startsWith('#')) return; openExt(l.href); }
});
let inTimer;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.pick) return pickSearch(t);
  if (t.dataset.in && inputs[t.dataset.in]) { clearTimeout(inTimer); inTimer = setTimeout(() => inputs[t.dataset.in](t.value.trim()), 300); }
});
$('#back').onclick = () => { if (history.length > 1) history.back(); else go('#/'); };
$('#refresh').onclick = () => { route(true); refreshTodoBadge(); };
$('#more').onclick = () => menuItems && sheet(menuItems);
window.addEventListener('hashchange', () => route());
const APP_ICONS = [['classic','Classic'],['daylight','Daylight'],['violet','Violet'],['ocean','Ocean'],['forest','Forest'],['ember','Ember'],['mono','Mono'],['pipeline','Pipeline']];
function applyIcon(k){ $('#mf').href = `manifest-${k}.webmanifest`; $('#fav').href = `icons/${k}.svg`; $('#ati').href = `icons/${k}-180.png`; }
function applyTheme(){ const t = store.get('theme'); if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
let started = false;
function start(){ if (started) return; started = true; applyTheme(); route(); if (cfg.token) refreshTodoBadge();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {}); }
document.addEventListener('DOMContentLoaded', start);
setTimeout(start, 3000);
</script>
